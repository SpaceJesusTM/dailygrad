# DailyGrad example configuration.
#
# Copy to dailygrad.toml (ignored by Git) and edit. Every setting is optional;
# the values below are the built-in defaults.
#
# DailyGrad looks for its config in this order:
#   1. dailygrad run --config PATH
#   2. the DAILYGRAD_CONFIG environment variable
#   3. ./dailygrad.toml
#
# `dailygrad config` prints the settings in effect and where every file goes.

# Where the database, the dated digests, latest.md and latest.json are written.
# A relative path resolves against the directory the command is run from, so
# use an absolute path when a scheduler runs DailyGrad.
data_dir = "data"

# How many news stories a digest shows. If fewer candidates are available, it shows those.
final_story_count = 5

# Seconds from the start of a run during which the model may be asked, or asked again after
# a transient failure. Once they are used up the run finishes with what it has, so a stuck
# Ollama cannot hold a run (or a caller waiting for it) indefinitely. A run can end up to
# about a minute later than this. Raise it together with ollama.timeout_seconds on slow hardware.
run_budget_seconds = 450

# The local model, served by Ollama. Any Ollama model that supports structured
# (JSON schema) output works; pull it first with `ollama pull <model>`.
[ollama]
url = "http://localhost:11434"
model = "qwen3.5:4b-q4_K_M"
context_tokens = 8192
# Used for choosing and summarising news. Micro-lessons are always generated at temperature 0.
temperature = 0.2
# Ask thinking-capable models to answer directly.
think = false
# Time allowed for one model request. Raise it for large models or CPU-only machines.
# A request that times out, or fails with HTTP 500, 502, 503 or 504, is tried once more.
timeout_seconds = 180

[filter]
# Ignore items older than this.
max_age_hours = 48
# Maximum number of candidates handed to the model, which picks final_story_count of them.
# The sources share these places equally.
shortlist_size = 18
# Words that mark a Hacker News title as AI-related (whole word, case-insensitive).
# A match raises the story's rank; it is not required. Setting this replaces the
# built-in list, and an empty list ranks Hacker News by popularity and freshness alone.
# keywords = ["AI", "LLM", "transformer"]

# `enabled = false` here or under [huggingface] removes the source altogether. To switch
# sources on and off day to day, use `dailygrad sources` instead: see docs/sources.md.
[hackernews]
enabled = true
min_points = 50
# A title matching a keyword ranks as if the story were this many times as popular.
keyword_boost = 4.0

[huggingface]
enabled = true
min_upvotes = 5

# RSS/Atom feeds. Defining any [[rss.feeds]] entry replaces the built-in list.
# Use `feeds = []` under [rss] to disable RSS entirely.
[[rss.feeds]]
name = "OpenAI"
url = "https://openai.com/news/rss.xml"

[[rss.feeds]]
name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"

[[rss.feeds]]
name = "Google Research"
url = "https://research.google/blog/rss/"

[[rss.feeds]]
name = "Hugging Face Blog"
url = "https://huggingface.co/blog/feed.xml"
