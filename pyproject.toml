[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dailygrad"
version = "0.2.0"
description = "A lightweight self-hosted daily AI briefing and micro-learning tool."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Ruo" }]
keywords = ["ai", "news", "digest", "ollama", "local-llm", "learning", "leetcode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "trafilatura>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/SpaceJesusTM/dailygrad"

[project.scripts]
dailygrad = "dailygrad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dailygrad = ["curriculum.toml", "leetcode.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
