[[problem]]
id = "shortest-palindrome"
number = 214
title = "Shortest Palindrome"
difficulty = "hard"
category = "arrays-hashing"
tracks = ["vanguard"]
statement = "Given a string, add characters only in front of it to turn it into a palindrome, and return the shortest palindrome obtainable that way."
input = "s = \"aacecaaa\""
output = "\"aaacecaaa\""
constraints = ["0 ≤ length ≤ 5·10^4"]
hints = [
  "Part of the string, starting from its first character, may already be a palindrome. Why does the longest such part matter?",
  "Checking every candidate length directly is quadratic. What string-matching tool finds the overlap between a string and its mirror image quickly?",
]
spoilers = ["kmp", "prefix function", "failure", "rolling hash", "manacher", "lps"]
approach = "Find the longest prefix of s that is a palindrome, then put the reverse of the remaining suffix in front. To find it in linear time, build s + '#' + reverse(s) and compute the KMP prefix function: its last value is the length of that palindromic prefix. A rolling hash works too."
time = "O(n)"
space = "O(n)"
edge_cases = ["an empty string", "the string is already a palindrome", "no palindromic prefix longer than one character"]

[[problem]]
id = "maximum-size-subarray-sum-equals-k"
number = 325
title = "Maximum Size Subarray Sum Equals k"
difficulty = "medium"
category = "arrays-hashing"
tracks = ["vanguard"]
premium = true
statement = "Given an integer array that may contain negative numbers and a value k, return the length of the longest contiguous subarray whose sum is exactly k, or 0 if there is none."
input = "nums = [1, -1, 5, -2, 3], k = 3"
output = "4"
constraints = ["1 ≤ n ≤ 2·10^5", "values may be negative"]
hints = [
  "Negative values mean that growing a stretch does not always raise its sum. Which familiar scanning technique does that rule out?",
  "The sum of a stretch is the difference of two running totals. What would you like to know about earlier running totals?",
]
spoilers = ["prefix", "hash", "map", "earliest", "first index"]
approach = "Keep a running prefix sum and a hash map from each prefix sum to the first index where it occurred. At index i, if prefix - k is in the map at index j, the subarray after j up to i sums to k and has length i - j. Recording only the first occurrence of each sum keeps the lengths as long as possible."
time = "O(n)"
space = "O(n)"
edge_cases = ["a subarray starting at index 0, so the map needs sum 0 at index -1", "no subarray sums to k", "zeros and negatives make several prefix sums equal"]

