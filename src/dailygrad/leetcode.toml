[[problem]]
id = "insert-interval"
number = 57
title = "Insert Interval"
difficulty = "medium"
category = "intervals"
tracks = ["neetcode-150"]
statement = "Given a list of non-overlapping intervals sorted by start and one new interval, insert it and merge wherever necessary so that the list stays sorted and non-overlapping."
input = "intervals = [[1, 3], [6, 9]], newInterval = [2, 5]"
output = "[[1, 5], [6, 9]]"
constraints = ["0 ≤ n ≤ 10^4", "the input is sorted by start"]
