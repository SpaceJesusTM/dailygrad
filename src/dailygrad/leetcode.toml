[[problem]]
id = "zero-array-transformation-i"
number = 3355
title = "Zero Array Transformation I"
difficulty = "medium"
category = "arrays-hashing"
tracks = ["vanguard"]
statement = "Given an integer array and a list of index ranges [l, r], each range lets you decrease by 1 any chosen subset of the elements inside it. Decide whether, after applying every range once, the whole array can be made zero."
input = "nums = [1, 0, 1], queries = [[0, 2]]"
output = "true"
constraints = ["1 ≤ n ≤ 10^5", "1 ≤ queries ≤ 10^5"]
hints = [
  "Because each range may skip any elements it likes, the elements do not compete with each other. What does one element need from the ranges?",
  "You need to know, for every index, how many ranges cover it. How can that be computed without walking each range?",
]
spoilers = ["difference array", "prefix", "sweep", "segment tree"]
approach = "An element can be reduced to zero exactly when the number of ranges covering its index is at least its value. Count the coverage with a difference array: add 1 at l and subtract 1 just after r for each range, then take prefix sums and check every index. Here q is the number of ranges."
time = "O(n + q)"
space = "O(n)"
edge_cases = ["an element that is already zero needs no coverage", "an index covered by no range but holding a positive value", "more coverage than needed is fine, since a range may skip an element"]

