# DailyGrad LeetCode catalog: the question bank behind the daily LeetCode micro-lesson.
#
# A snapshot, made during development, of three problem lists. A run reads only this file: it
# never contacts LeetCode or the sources. docs/leetcode.md describes the sources, what was
# taken from each, and how to refresh the snapshot.
#
# Which problems are listed, and their numbers, titles and difficulties, are facts taken from
# the sources and checked against LeetCode's public problem list. Everything else in an entry
# (statement, example, hints, approach, edge cases) was written for DailyGrad. No problem
# description or solution was copied from LeetCode or from the sources.
#
# Fields of a [[problem]]:
#   id           LeetCode's slug: the stable identifier, never reused or renamed (history refers to it).
#                The problem's address is https://leetcode.com/problems/<id>/
#   number       LeetCode's problem number
#   title, difficulty (easy | medium | hard)
#   category     the topic, one of the keys of CATEGORIES in leetcode_catalog.py; it orders a
#                track and is never shown, because naming the topic names the technique
#   tracks       every source that lists the problem; a problem in several lists is still one entry
#   premium      true if LeetCode shows the full problem only to subscribers (optional)
#   statement    a short original summary of the task
#   input, output  one representative example, each a single line
#   constraints  1 to 4 that matter for choosing an approach
#   hints        1 to 3, gentlest first; the first may appear in a digest, so it must not name the
#                approach, and none states a complexity
#   spoilers     words that would give the approach away: a generated hint containing one is discarded
#   approach, time, space, edge_cases   the reference solution, for feedback and review only;
#                these never appear in a digest
#
# Order matters only within a topic: a track shows easy problems first, then medium, then hard,
# and within a difficulty follows the topics, then the order of this file.

[catalog]
snapshot = "2026-10-09"

[[source]]
id = "neetcode-150"
name = "NeetCode 150"
kind = "curriculum"
publisher = "NeetCode"
url = "https://github.com/richard7ao/neetcode-150"
retrieved = "2026-10-09"
problems = 150

