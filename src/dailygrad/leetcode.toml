[[problem]]
id = "valid-sudoku"
number = 36
title = "Valid Sudoku"
difficulty = "medium"
category = "arrays-hashing"
tracks = ["neetcode-150"]
statement = "Given a partly filled 9×9 Sudoku board, decide whether the filled cells break a rule: no digit may repeat in a row, in a column or in a 3×3 box. The board does not have to be solvable."
input = "a board with two 8s in its top-left 3×3 box"
output = "false"
constraints = ["the board is always 9×9", "a cell holds a digit 1-9 or is empty"]
hints = [
  "Each filled cell belongs to three groups at once. What do you need to remember about each group?",
  "How can you tell from a cell's row and column which 3×3 box it is in?",
]
spoilers = ["hash", "set", "bitmask"]
approach = "Keep a set of seen digits for each row, each column and each box, where the box index is (row // 3) * 3 + col // 3. Scan every cell once; a digit already in any of its three sets makes the board invalid. The board is a fixed 81 cells, so the work is constant; for an n×n board it is O(n^2)."
time = "O(1)"
space = "O(1)"
edge_cases = ["empty cells are skipped", "a valid board that cannot be solved is still valid", "a repeat that shows only inside a box"]

