[[problem]]
id = "contains-duplicate"
number = 217
title = "Contains Duplicate"
difficulty = "easy"
category = "arrays-hashing"
tracks = ["neetcode-150"]
statement = "Given an integer array, decide whether any value appears more than once."
input = "nums = [1, 2, 3, 1]"
output = "true"
constraints = ["1 ≤ n ≤ 10^5"]
hints = [
  "What would you need to remember about the values you have already passed?",
  "A structure with constant-time membership checks lets you finish in a single pass.",
]
spoilers = ["hash", "set", "sort"]
approach = "Walk the array adding each value to a hash set; a value that is already in the set is a duplicate. Sorting and comparing neighbours also works, in O(n log n) time with less extra space."
time = "O(n)"
space = "O(n)"
edge_cases = ["a single element", "all values distinct", "negative values"]

[[problem]]
id = "valid-anagram"
number = 242
title = "Valid Anagram"
difficulty = "easy"
category = "arrays-hashing"
tracks = ["neetcode-150"]
statement = "Given two strings, decide whether one is a rearrangement of the other's letters."
input = "s = \"anagram\", t = \"nagaram\""
output = "true"
constraints = ["1 ≤ length ≤ 5·10^4", "lowercase English letters only"]
hints = [
  "Two strings that are rearrangements of each other must agree on something you can measure. What is it?",
  "Compare how often each letter occurs in the two strings.",
]
spoilers = ["count", "frequen", "sort", "hash"]
approach = "Count each letter of the first string in a 26-slot array, subtract the counts of the second, and check that every slot is zero. Different lengths fail at once. The alphabet is fixed, so the counts take constant space."
time = "O(n)"
space = "O(1)"
edge_cases = ["different lengths", "the same letters in different amounts", "Unicode input would need a hash map instead of 26 slots"]

[[problem]]
id = "two-sum"
number = 1
title = "Two Sum"
difficulty = "easy"
category = "arrays-hashing"
tracks = ["neetcode-150", "amd"]
statement = "Given an integer array and a target, return the indices of the two different elements that add up to the target."
input = "nums = [2, 7, 11, 15], target = 9"
output = "[0, 1]"
constraints = ["2 ≤ n ≤ 10^4", "exactly one valid pair exists"]
hints = [
  "Could remembering the elements you have already visited save you from comparing every pair?",
  "For each element you know exactly which partner value you need. How quickly can you check whether you have seen it?",
]
spoilers = ["hash", "dictionary", "complement", "map"]
approach = "Scan once, keeping a hash map from value to index. For each element look up the target minus that element; if it is in the map return the two indices, otherwise store the element."
time = "O(n)"
space = "O(n)"
edge_cases = ["the same value used twice, such as [3, 3] with target 6", "negative numbers", "the pair sits at the very end"]

[[problem]]
id = "group-anagrams"
number = 49
title = "Group Anagrams"
difficulty = "medium"
category = "arrays-hashing"
tracks = ["neetcode-150"]
statement = "Given a list of strings, group together the ones that are rearrangements of each other."
input = "strs = [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]"
output = "[[\"eat\", \"tea\", \"ate\"], [\"tan\", \"nat\"], [\"bat\"]]"
constraints = ["1 ≤ n ≤ 10^4", "each string has at most 100 lowercase letters"]
hints = [
  "What could you compute from a string that comes out identical for every rearrangement of it?",
  "Use that computed value as the label under which you collect the strings.",
]
spoilers = ["sort", "hash", "count", "key"]
approach = "Give every string a canonical key, either its sorted letters or its 26 letter counts, and collect the strings in a hash map from key to group. Here k is the longest string; letter counts as the key bring the time down to O(n * k)."
time = "O(n * k log k)"
space = "O(n * k)"
edge_cases = ["the empty string", "a string with no partner forms its own group", "duplicate strings"]

[[problem]]
id = "top-k-frequent-elements"
number = 347
title = "Top K Frequent Elements"
difficulty = "medium"
category = "arrays-hashing"
tracks = ["neetcode-150", "amd"]
statement = "Given an integer array and a number k, return the k values that occur most often."
input = "nums = [1, 1, 1, 2, 2, 3], k = 2"
output = "[1, 2]"
constraints = ["1 ≤ n ≤ 10^5", "the answer is unique"]
hints = [
  "Split the task in two: first measure something about each value, then select from those measurements.",
  "After counting, you do not need a full ordering of the values, only the top k.",
]
spoilers = ["heap", "bucket", "hash", "priority", "quickselect"]
approach = "Count occurrences in a hash map, then place each value in a bucket indexed by its count (at most n) and read the buckets from the highest down until k values are collected. A min-heap of size k over the counts gives O(n log k) instead."
time = "O(n)"
space = "O(n)"
edge_cases = ["k equals the number of distinct values", "a single element", "negative values"]

