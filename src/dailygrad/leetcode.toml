[[problem]]
id = "jump-game"
number = 55
title = "Jump Game"
difficulty = "medium"
category = "greedy"
tracks = ["neetcode-150", "vanguard"]
statement = "Each element of an array gives the maximum jump length from that position. Starting at the first index, decide whether the last index can be reached."
input = "nums = [2, 3, 1, 1, 4]"
output = "true"
constraints = ["1 ≤ n ≤ 10^4", "0 ≤ value ≤ 10^5"]
hints = [
  "You do not need to know the route, only how far it is possible to get. What single number captures that?",
  "As you scan, what would tell you that you are standing somewhere you could never have reached?",
]
spoilers = ["greedy", "farthest", "furthest", "dynamic", "dp"]
approach = "Greedy: scan left to right keeping the farthest index reachable so far. If the current index is beyond it, the end cannot be reached; otherwise extend it with index plus jump length. Success as soon as it covers the last index."
time = "O(n)"
space = "O(1)"
edge_cases = ["a single element is already at the end", "a zero that cannot be jumped over", "zeros that can be jumped over"]

[[problem]]
id = "jump-game-ii"
number = 45
title = "Jump Game II"
difficulty = "medium"
category = "greedy"
tracks = ["neetcode-150"]
statement = "Each element of an array gives the maximum jump length from that position. Starting at the first index, return the minimum number of jumps needed to reach the last index, which is always reachable."
input = "nums = [2, 3, 1, 1, 4]"
output = "2"
constraints = ["1 ≤ n ≤ 10^4", "the last index can always be reached"]
hints = [
  "Group the positions by how many jumps it takes to get to them. What do the groups look like?",
  "From everything reachable with the current number of jumps, how far can one more jump take you?",
]
spoilers = ["greedy", "bfs", "level", "window", "farthest", "furthest"]
approach = "Greedy, like a breadth-first search over ranges: track the end of the range reachable with the current number of jumps and the farthest index reachable from inside it. When the scan passes the end of the range, take one more jump and set the end to that farthest index."
time = "O(n)"
space = "O(1)"
edge_cases = ["a single element needs 0 jumps", "the first jump already reaches the end", "do not count a jump after arriving at the last index"]

[[problem]]
id = "gas-station"
number = 134
title = "Gas Station"
difficulty = "medium"
category = "greedy"
tracks = ["neetcode-150"]
statement = "Gas stations stand in a circle. Station i supplies gas[i] and driving to the next station costs cost[i]. Starting with an empty tank, return the index of a station from which you can drive once around the circle, or -1 if none exists. The answer is unique when it exists."
input = "gas = [1, 2, 3, 4, 5], cost = [3, 4, 5, 1, 2]"
output = "3"
constraints = ["1 ≤ n ≤ 10^5"]
hints = [
  "Is there a quick test for whether any starting station can work at all?",
  "If you start at one station and run out before reaching another, what does that say about the stations in between as starting points?",
