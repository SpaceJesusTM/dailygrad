id = "unique-paths"
number = 62
title = "Unique Paths"
difficulty = "medium"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "A robot starts at the top-left cell of an m×n grid and can move only right or down. Return the number of different paths to the bottom-right cell."
input = "m = 3, n = 7"
output = "28"
constraints = ["1 ≤ m, n ≤ 100"]
hints = [
  "From which cells can the robot step directly into a given cell?",
  "The number of paths into a cell is built from the numbers for the cells it can come from.",
]
spoilers = ["dynamic", "dp", "combinat", "binomial", "pascal"]
approach = "Dynamic programming: the paths to a cell are the paths to the cell above plus the paths to the cell on its left, with one path along the first row and first column. A single row updated in place is enough. The answer also equals the binomial coefficient C(m + n - 2, m - 1)."
time = "O(m * n)"
space = "O(n)"
edge_cases = ["a single row or column has one path", "a 1×1 grid", "large grids overflow 32 bits in some languages"]

[[problem]]
id = "longest-common-subsequence"
number = 1143
title = "Longest Common Subsequence"
difficulty = "medium"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Given two strings, return the length of the longest sequence of characters that appears in both in the same order, not necessarily contiguously."
input = "text1 = \"abcde\", text2 = \"ace\""
output = "3"
constraints = ["1 ≤ lengths ≤ 1000"]
hints = [
  "Compare the last characters of the two strings. What happens when they match, and what are the options when they do not?",
  "The answer for two strings depends on answers for shorter beginnings of those strings.",
]
spoilers = ["dynamic", "dp", "table", "memo", "grid"]
approach = "Fill a table where entry (i, j) is the answer for the first i characters of one string and the first j of the other: if the characters match it is the diagonal neighbour plus one, otherwise the larger of the entries above and to the left. Keeping only two rows reduces the space to the shorter length."
time = "O(m * n)"
space = "O(min(m, n))"
edge_cases = ["no common characters gives 0", "identical strings", "one string is a subsequence of the other"]

[[problem]]
id = "best-time-to-buy-and-sell-stock-with-cooldown"
number = 309
title = "Best Time to Buy and Sell Stock with Cooldown"
difficulty = "medium"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Given daily prices, buy and sell one share as many times as you like for the largest total profit, holding at most one share at a time. After selling you must wait one day before buying again."
input = "prices = [1, 2, 3, 0, 2]"
output = "3"
constraints = ["1 ≤ n ≤ 5000"]
hints = [
  "On any day you are in one of a small number of situations. Can you list them?",
  "Write how each situation today can arise from yesterday's situations.",
]
spoilers = ["state", "dynamic", "dp", "machine"]
approach = "A state machine with three states per day: holding a share, just sold (in cooldown), and resting without a share. Holding comes from holding or from resting and buying; sold comes from holding and selling; resting comes from resting or from sold. Carry the three best profits forward and return the larger of sold and resting."
time = "O(n)"
space = "O(1)"
edge_cases = ["a single day", "prices only fall, so the answer is 0", "the cooldown blocks an otherwise ideal buy"]

[[problem]]
id = "coin-change-ii"
number = 518
title = "Coin Change II"
difficulty = "medium"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Given coin denominations and an amount, return the number of different combinations of coins that make that amount, with unlimited coins of each kind. The order of coins does not matter."
input = "amount = 5, coins = [1, 2, 5]"
output = "4"
constraints = ["1 ≤ coins ≤ 300", "0 ≤ amount ≤ 5000"]
hints = [
  "How do you avoid counting 1 + 2 and 2 + 1 as two different answers?",
  "Decide the order in which coin kinds are considered, and let each kind extend the counts made with the kinds before it.",
]
spoilers = ["dynamic", "dp", "knapsack", "outer loop"]
approach = "Dynamic programming over amounts with the coins in the outer loop: start with one way to make 0, and for each coin add ways[a - coin] into ways[a] for every amount a from the coin upward. Handling one coin kind at a time counts combinations rather than orderings. Here n is the amount and m the number of coin kinds."
time = "O(n * m)"
space = "O(n)"
edge_cases = ["amount 0 has exactly one combination", "no combination exists", "swapping the two loops would count orderings instead"]

[[problem]]
id = "target-sum"
number = 494
title = "Target Sum"
difficulty = "medium"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Given an array of non-negative integers and a target, put a + or - sign in front of every number. Return how many sign assignments make the expression equal the target."
input = "nums = [1, 1, 1, 1, 1], target = 3"
output = "5"
constraints = ["1 ≤ n ≤ 20", "the sum of the numbers is at most 1000"]
hints = [
  "Trying all sign assignments works for small inputs. Which partial results get recomputed again and again?",
  "The numbers given a plus sign form a group. What must that group add up to?",
]
spoilers = ["dynamic", "dp", "memo", "subset", "knapsack"]
approach = "If P is the sum of the numbers given a plus sign, then P = (total + target) / 2, so count the subsets that sum to P with a subset-sum table, iterating sums downward for each number. The count is zero when total + target is odd or the target is out of range. Memoising on (index, running sum) is the direct alternative. Here s is the sum of the numbers."
time = "O(n * s)"
space = "O(s)"
edge_cases = ["zeros double the count, since either sign works", "a target larger than the total in absolute value", "total + target is odd"]

[[problem]]
id = "interleaving-string"
number = 97
title = "Interleaving String"
difficulty = "medium"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Given strings s1, s2 and s3, decide whether s3 can be formed by interleaving s1 and s2, keeping the characters of each in their original order."
input = "s1 = \"aabcc\", s2 = \"dbbca\", s3 = \"aadbbcbcac\""
output = "true"
constraints = ["0 ≤ lengths of s1 and s2 ≤ 100"]
hints = [
  "At any moment, what do you need to know about your progress to decide what can come next?",
  "How much of s1 and of s2 has been used fixes how much of s3 has been built.",
]
spoilers = ["dynamic", "dp", "table", "memo", "grid"]
approach = "First check that the lengths add up. Then fill a table where entry (i, j) says whether the first i characters of s1 and the first j of s2 can form the first i + j of s3: true if the entry above is true and s1's character matches, or the entry to the left is true and s2's character matches. A single row is enough if space matters."
time = "O(m * n)"
space = "O(m * n)"
edge_cases = ["the lengths do not add up", "one of the strings is empty", "both strings could supply the next character"]

[[problem]]
id = "longest-increasing-path-in-a-matrix"
number = 329
title = "Longest Increasing Path in a Matrix"
difficulty = "hard"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Given a matrix of integers, return the length of the longest path through horizontally or vertically adjacent cells along which the values strictly increase."
input = "matrix = [[9, 9, 4], [6, 6, 8], [2, 1, 1]]"
output = "4"
constraints = ["1 ≤ rows, columns ≤ 200"]
hints = [
  "The longest path starting from a cell depends on its larger neighbours. Why can that never lead you around in a circle?",
  "Many paths pass through the same cell. What should you remember about each cell so its work is done once?",
]
spoilers = ["memo", "dfs", "dynamic", "dp", "topolog", "cache"]
approach = "Depth-first search with memoisation: the longest increasing path starting at a cell is 1 plus the best result among its strictly larger neighbours, cached per cell. The strict increase rules out cycles, so no visited set is needed. Each cell is computed once."
time = "O(m * n)"
space = "O(m * n)"
edge_cases = ["all values equal gives 1", "a single cell", "a snake-shaped path that covers the whole matrix"]

[[problem]]
id = "distinct-subsequences"
number = 115
title = "Distinct Subsequences"
difficulty = "hard"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Given strings s and t, return the number of distinct ways to choose characters of s, keeping their order, so that they spell t."
input = "s = \"rabbbit\", t = \"rabbit\""
output = "3"
constraints = ["1 ≤ lengths ≤ 1000"]
hints = [
  "Look at one character of s at a time: it is either part of the match or it is not. When is each option available?",
  "The count for the beginnings of the two strings is built from counts for shorter beginnings.",
]
spoilers = ["dynamic", "dp", "table", "memo"]
approach = "Fill a table where entry (i, j) is the number of ways the first i characters of s spell the first j of t. Skipping s's character always carries over entry (i - 1, j); if the characters match, add entry (i - 1, j - 1). An empty t can be formed in exactly one way."
time = "O(m * n)"
space = "O(m * n)"
edge_cases = ["t longer than s gives 0", "an empty t gives 1", "the counts grow very large"]

[[problem]]
id = "edit-distance"
number = 72
title = "Edit Distance"
difficulty = "medium"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Given two words, return the minimum number of single-character insertions, deletions and replacements needed to turn the first into the second."
input = "word1 = \"horse\", word2 = \"ros\""
output = "3"
constraints = ["0 ≤ lengths ≤ 500"]
hints = [
  "Compare the last characters of the two words. If they are equal, what is left to solve? If not, what are the three possible last moves?",
  "Each possible last move leaves a smaller pair of words.",
]
spoilers = ["dynamic", "dp", "table", "memo", "levenshtein"]
approach = "Fill a table where entry (i, j) is the distance between the first i characters of word1 and the first j of word2. If the characters match it copies the diagonal entry; otherwise it is 1 plus the smallest of the entries for delete (above), insert (left) and replace (diagonal). The first row and column count plain insertions or deletions."
time = "O(m * n)"
space = "O(m * n)"
edge_cases = ["one word is empty", "identical words give 0", "words with no characters in common"]

[[problem]]
id = "burst-balloons"
number = 312
title = "Burst Balloons"
difficulty = "hard"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Balloons in a row each carry a number. Bursting a balloon earns the product of its number and the numbers of its current left and right neighbours, with 1 used beyond either end. Return the maximum coins obtainable by bursting all of them."
input = "nums = [3, 1, 5, 8]"
output = "167"
constraints = ["1 ≤ n ≤ 300"]
hints = [
  "Bursting a balloon changes who its neighbours' neighbours are, so the two sides stay tangled together. Is there a way of looking at the order of bursts that separates them?",
  "Think about which balloon in a stretch is burst last, not first: the parts on either side of it can then be solved separately.",
]
spoilers = ["interval", "dynamic", "dp", "last", "memo"]
approach = "Interval dynamic programming. Pad the array with 1 at both ends and let best(l, r) be the most coins from bursting everything strictly between l and r. Choose the balloon k in that range to burst last: it earns nums[l] * nums[k] * nums[r] plus best(l, k) and best(k, r). Fill in order of increasing interval length."
time = "O(n^3)"
space = "O(n^2)"
edge_cases = ["a single balloon", "balloons with value 0", "choosing the first balloon to burst does not split the problem cleanly"]

[[problem]]
id = "regular-expression-matching"
number = 10
title = "Regular Expression Matching"
difficulty = "hard"
category = "dp-2d"
tracks = ["neetcode-150"]
statement = "Decide whether a string matches a pattern in which a dot matches any single character and a star means zero or more of the element just before it. The match must cover the whole string."
input = "s = \"aab\", p = \"c*a*b\""
output = "true"
constraints = ["1 ≤ string length ≤ 20", "1 ≤ pattern length ≤ 20", "every star follows a valid character"]
hints = [
  "A star belongs to the element before it. For that pair, what are the two things you can do?",
  "Whether the rest of the string matches the rest of the pattern is asked many times for the same two positions.",
]
spoilers = ["dynamic", "dp", "memo", "table", "recurs"]
approach = "Dynamic programming on (position in string, position in pattern). If the next pattern element is followed by a star, either skip the pair (zero copies) or, when the current character matches, consume one character and stay on the same pair. Otherwise the current characters must match and both positions advance. Memoise the results or fill a table."
time = "O(m * n)"
space = "O(m * n)"
edge_cases = ["a pattern such as a*b*c* matches the empty string", "dot-star matches anything", "a star that must match zero copies"]

