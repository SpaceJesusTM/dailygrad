[[problem]]
id = "design-hashmap"
number = 706
title = "Design HashMap"
difficulty = "easy"
category = "arrays-hashing"
tracks = ["vanguard"]
statement = "Design a map from integer keys to integer values supporting put, get (returning -1 for a missing key) and remove, without using any built-in hash table."
input = "put(1, 1), put(2, 2), get(1), get(3), put(2, 1), get(2), remove(2), get(2)"
output = "1, -1, 1, -1"
constraints = ["0 ≤ key, value ≤ 10^6", "up to 10^4 calls"]
hints = [
  "A plain array indexed by key would work but wastes space. How could many possible keys share a smaller array?",
  "Two different keys may land in the same slot. What will you keep in a slot so that both survive?",
]
spoilers = ["bucket", "chain", "modulo", "collision", "linked list", "probing"]
approach = "Use an array of buckets and send a key to the bucket numbered key mod the number of buckets, ideally a prime. Each bucket holds a short list of (key, value) pairs: put updates or appends, get scans the bucket, remove deletes the pair. With a sensible load factor each operation is constant time on average. The space is for n entries and b buckets."
time = "O(1)"
space = "O(n + b)"
edge_cases = ["putting an existing key updates it", "removing a missing key does nothing", "many keys colliding in one bucket"]

